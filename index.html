<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guess</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <h1>Number Guessing Game</h1>
        <input type="text" id="userGuess" placeholder="Enter the number between 1 and 10">
        <button id="guess" onclick="numGuess()">Guess</button>
        <p id="result"></p>
        <p id="attemptsLeft"></p>

    </div>

    <script src="script.js"></script>
</body>

</html>
